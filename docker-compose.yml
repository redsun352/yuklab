services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: yuklab
      POSTGRES_USER: yuklab
      POSTGRES_PASSWORD: yuklab_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
